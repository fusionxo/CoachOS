<!-- Interactive Logic -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentStep = 1;
            const totalSteps = 3;
            
            const btnNext = document.getElementById('btn-next');
            const btnBack = document.getElementById('btn-back');
            const progressBar = document.getElementById('progress-indicator');
            const stepCounter = document.getElementById('step-counter');

            function updateUI() {
                // Update Step Visibility
                for(let i=1; i<=totalSteps; i++) {
                    const stepEl = document.getElementById(`step-${i}`);
                    if(i === currentStep) {
                        stepEl.classList.remove('step-hidden');
                        stepEl.classList.add('step-active');
                    } else {
                        stepEl.classList.remove('step-active');
                        stepEl.classList.add('step-hidden');
                    }
                }

                // Update Progress Bar
                const progressPercentage = (currentStep / totalSteps) * 100;
                progressBar.style.width = `${progressPercentage}%`;

                // Update Counter
                stepCounter.textContent = `STEP ${currentStep} OF ${totalSteps}`;

                // Update Buttons
                if(currentStep === 1) {
                    btnBack.classList.add('invisible');
                } else {
                    btnBack.classList.remove('invisible');
                }

                if(currentStep === totalSteps) {
                    btnNext.innerHTML = `
                        Create Workspace
                        <span class="material-symbols-outlined text-sm" data-icon="check">check</span>
                    `;
                } else {
                    btnNext.innerHTML = `
                        Continue
                        <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
                    `;
                }
            }

            btnNext.addEventListener('click', () => {
                if(currentStep < totalSteps) {
                    currentStep++;
                    updateUI();
                } else {
                    // Final Action (Simulated)
                    btnNext.innerHTML = `
                        <span class="material-symbols-outlined text-sm animate-spin" data-icon="progress_activity">progress_activity</span>
                        Building...
                    `;
                    setTimeout(() => {
                        showToast("Workspace Created Successfully!", "success", "Workspace Ready");
                    }, 1000);
                }
            });

            btnBack.addEventListener('click', () => {
                if(currentStep > 1) {
                    currentStep--;
                    updateUI();
                }
            });
            
            // Allow clicking options to auto-advance on step 1 & 2 for a smoother feel
            const radioInputs = document.querySelectorAll('input[type="radio"]');
            radioInputs.forEach(input => {
                input.addEventListener('change', () => {
                    if(currentStep < 3) {
                        setTimeout(() => {
                            currentStep++;
                            updateUI();
                        }, 300); // slight delay for visual feedback
                    }
                });
            });

            // Initialize
            updateUI();
        });
    </script>
