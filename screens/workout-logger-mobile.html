<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>Workout Logging - CoachOS</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700;900&amp;family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-container-high": "#292b24",
                      "on-tertiary-fixed": "#121c28",
                      "tertiary-fixed": "#d9e3f4",
                      "error": "#ffb4ab",
                      "primary-fixed": "#ceee93",
                      "on-surface": "#e3e3d9",
                      "on-secondary-fixed-variant": "#2f2ebe",
                      "surface-container-highest": "#34352f",
                      "on-tertiary-fixed-variant": "#3e4755",
                      "on-surface-variant": "#c5c8b7",
                      "on-primary-fixed": "#131f00",
                      "on-error": "#690005",
                      "secondary-fixed": "#e1e0ff",
                      "primary-container": "#ceee93",
                      "on-tertiary": "#27313e",
                      "tertiary-fixed-dim": "#bdc7d7",
                      "on-secondary": "#1000a9",
                      "on-primary": "#243600",
                      "inverse-on-surface": "#2f312a",
                      "on-background": "#e3e3d9",
                      "inverse-primary": "#4d661c",
                      "secondary": "#c0c1ff",
                      "surface-bright": "#383a33",
                      "on-secondary-container": "#b0b2ff",
                      "surface-dim": "#12140e",
                      "outline-variant": "#44483b",
                      "error-container": "#93000a",
                      "primary-fixed-dim": "#b3d17a",
                      "on-secondary-fixed": "#07006c",
                      "surface-container": "#1f201a",
                      "surface": "#12140e",
                      "on-error-container": "#ffdad6",
                      "background": "#12140e",
                      "primary": "#ffffff",
                      "tertiary-container": "#d9e3f4",
                      "on-primary-fixed-variant": "#364e03",
                      "surface-container-low": "#1b1c16",
                      "surface-variant": "#34352f",
                      "secondary-fixed-dim": "#c0c1ff",
                      "on-tertiary-container": "#5b6573",
                      "tertiary": "#ffffff",
                      "secondary-container": "#3131c0",
                      "outline": "#8f9282",
                      "on-primary-container": "#536d22",
                      "surface-container-lowest": "#0d0f09",
                      "surface-tint": "#b3d17a",
                      "inverse-surface": "#e3e3d9"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit-sm": "8px",
                      "container-max": "1440px",
                      "margin-mobile": "16px",
                      "unit-lg": "24px",
                      "unit-xl": "48px",
                      "unit-xs": "4px",
                      "unit-md": "16px",
                      "gutter": "24px"
              },
              "fontFamily": {
                      "stat-mono": [
                              "JetBrains Mono"
                      ],
                      "display-lg": [
                              "Geist"
                      ],
                      "body-base": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Geist"
                      ],
                      "body-sm": [
                              "Inter"
                      ],
                      "display-lg-mobile": [
                              "Geist"
                      ],
                      "label-caps": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "stat-mono": [
                              "18px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "500"
                              }
                      ],
                      "display-lg": [
                              "48px",
                              {
                                      "lineHeight": "56px",
                                      "letterSpacing": "-0.04em",
                                      "fontWeight": "700"
                              }
                      ],
                      "body-base": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "letterSpacing": "0em",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-sm": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "letterSpacing": "0em",
                                      "fontWeight": "400"
                              }
                      ],
                      "display-lg-mobile": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"
                              }
                      ]
              }
            }
          }
        }
    </script>
<style>
        /* Hide scrollbar for clean mobile look */
        ::-webkit-scrollbar {
            display: none;
        }
        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
            overscroll-behavior-y: none;
        }
        /* Custom numeric input hiding spinners */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[100px] flex flex-col font-body-base">
<!-- Top App Bar (Contextual) -->
<header class="sticky top-0 w-full z-40 bg-surface/90 backdrop-blur-md px-margin-mobile h-16 flex justify-between items-center max-w-container-max mx-auto border-b border-outline-variant/30">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-container-high active:scale-95">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back_ios</span>
</button>
<div class="flex-1 text-center">
<h1 class="font-headline-md text-headline-md font-bold text-primary">Logging</h1>
</div>
<div class="flex items-center gap-2">
<!-- Autosave Indicator -->
<span class="flex items-center gap-1 text-[10px] uppercase tracking-wider text-outline">
<span class="w-1.5 h-1.5 rounded-full bg-[#22c55e] animate-pulse"></span>
                Saved
            </span>
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center justify-center w-10 h-10 -mr-2 rounded-full hover:bg-surface-container-high active:scale-95">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
</header>
<!-- Main Canvas -->
<main class="flex-1 flex flex-col px-margin-mobile py-unit-lg max-w-[600px] w-full mx-auto space-y-unit-xl">
<!-- Exercise Header Context -->
<section class="flex flex-col gap-unit-sm">
<div class="flex items-start justify-between">
<div>
<span class="text-[#c0c1ff] font-label-caps text-label-caps tracking-widest uppercase mb-1 block">Exercise 2 of 5</span>
<h2 class="font-display-lg-mobile text-display-lg-mobile text-primary font-black tracking-tight leading-none">Barbell Bench Press</h2>
</div>
<!-- Mini history graph or visual -->
<div class="w-16 h-12 bg-surface-container rounded-lg border border-outline-variant flex items-end justify-between p-1 opacity-70">
<div class="w-2 bg-primary-container/30 h-[40%] rounded-sm"></div>
<div class="w-2 bg-primary-container/50 h-[60%] rounded-sm"></div>
<div class="w-2 bg-primary-container/80 h-[50%] rounded-sm"></div>
<div class="w-2 bg-primary-container h-[90%] rounded-sm"></div>
</div>
</div>
<div class="flex gap-3 text-on-surface-variant font-body-sm text-body-sm">
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">info</span> Target: Chest</span>
<span class="flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">history</span> Last: 80kg x 8</span>
</div>
</section>
<!-- Current Set Active Card (Glassmorphism + Neon Accent) -->
<section class="bg-[#18181b] border border-[#27272a] rounded-xl p-unit-lg relative overflow-hidden flex flex-col gap-unit-md shadow-[0_8px_32px_0_rgba(0,0,0,0.4)] ring-1 ring-[#ceee93]/10">
<!-- Active indicator pulse -->
<div class="absolute top-0 left-0 w-1 h-full bg-[#ceee93]"></div>
<div class="absolute -top-10 -right-10 w-32 h-32 bg-[#ceee93]/5 rounded-full blur-2xl"></div>
<div class="flex justify-between items-center mb-2 z-10">
<h3 class="font-headline-md text-headline-md text-primary flex items-center gap-2">
<span class="w-6 h-6 rounded bg-[#ceee93] text-[#09090b] flex items-center justify-center font-bold text-sm">3</span>
                    Working Set
                </h3>
<span class="bg-[#ceee93]/10 text-[#ceee93] border border-[#ceee93]/20 px-2 py-0.5 rounded text-xs font-bold tracking-widest uppercase">Target: 8-10 Reps</span>
</div>
<div class="grid grid-cols-2 gap-unit-md z-10">
<!-- Weight Input -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant">Weight (kg)</label>
<div class="relative group">
<input class="w-full bg-[#09090b] border border-[#27272a] rounded-lg h-16 px-4 font-stat-mono text-[24px] text-primary focus:border-[#6366f1] focus:ring-2 focus:ring-[#6366f1]/20 transition-all text-center" type="number" value="82.5">
<div class="absolute inset-y-0 right-2 flex flex-col justify-center gap-1">
<button class="w-8 h-6 bg-surface-container-high rounded text-on-surface hover:text-primary flex items-center justify-center border border-outline-variant active:scale-95"><span class="material-symbols-outlined text-sm">add</span></button>
<button class="w-8 h-6 bg-surface-container-high rounded text-on-surface hover:text-primary flex items-center justify-center border border-outline-variant active:scale-95"><span class="material-symbols-outlined text-sm">remove</span></button>
</div>
</div>
</div>
<!-- Reps Input -->
<div class="flex flex-col gap-1">
<label class="font-label-caps text-label-caps text-on-surface-variant">Reps</label>
<div class="relative">
<input class="w-full bg-[#09090b] border border-[#27272a] rounded-lg h-16 px-4 font-stat-mono text-[24px] text-primary focus:border-[#6366f1] focus:ring-2 focus:ring-[#6366f1]/20 transition-all text-center" placeholder="0" type="number">
<div class="absolute inset-y-0 right-2 flex flex-col justify-center gap-1">
<button class="w-8 h-6 bg-surface-container-high rounded text-on-surface hover:text-primary flex items-center justify-center border border-outline-variant active:scale-95"><span class="material-symbols-outlined text-sm">add</span></button>
<button class="w-8 h-6 bg-surface-container-high rounded text-on-surface hover:text-primary flex items-center justify-center border border-outline-variant active:scale-95"><span class="material-symbols-outlined text-sm">remove</span></button>
</div>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-[#d9f99d] text-[#09090b] font-bold text-lg rounded-lg flex items-center justify-center gap-2 mt-2 active:scale-[0.98] transition-transform z-10 shadow-[0_0_20px_rgba(217,249,157,0.15)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                Complete Set
            </button>
</section>
<!-- Previous Sets List (Bento-ish History) -->
<section class="flex flex-col gap-unit-sm">
<h4 class="font-label-caps text-label-caps text-on-surface-variant mb-2">Today's Performance</h4>
<div class="flex flex-col gap-2">
<!-- Completed Set 1 -->
<div class="bg-[#18181b] border border-[#27272a] rounded-lg p-3 flex items-center justify-between opacity-60">
<div class="flex items-center gap-4">
<span class="w-6 h-6 rounded bg-surface-container-high text-on-surface-variant flex items-center justify-center font-stat-mono text-sm">1</span>
<div class="flex flex-col">
<span class="text-on-surface-variant text-xs">Warmup</span>
<span class="font-stat-mono text-primary">60kg × 12</span>
</div>
</div>
<span class="material-symbols-outlined text-[#22c55e]">check</span>
</div>
<!-- Completed Set 2 -->
<div class="bg-[#18181b] border border-[#27272a] rounded-lg p-3 flex items-center justify-between opacity-60">
<div class="flex items-center gap-4">
<span class="w-6 h-6 rounded bg-surface-container-high text-on-surface-variant flex items-center justify-center font-stat-mono text-sm">2</span>
<div class="flex flex-col">
<span class="text-on-surface-variant text-xs">Working</span>
<span class="font-stat-mono text-primary">80kg × 10</span>
</div>
</div>
<span class="material-symbols-outlined text-[#22c55e]">check</span>
</div>
</div>
<button class="w-full py-3 mt-2 border border-[#27272a] text-[#fafafa] rounded-lg font-body-sm text-body-sm flex items-center justify-center gap-2 active:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-sm">add</span> Add Another Set
            </button>
</section>
</main>
<!-- Bottom Nav Shell (Suppressed due to Task-Focused linear flow - wait, user requested Bottom Nav explicitly in prompt: "Bottom Navigation: Home, Training, Progress, Messages." Overriding strict semantic shell mandate to fulfill user explicit request) -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/80 dark:bg-surface/80 backdrop-blur-xl shadow-[0_-8px_32px_0_rgba(0,0,0,0.4)] fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-mobile py-unit-sm md:hidden">
<button class="flex flex-col items-center justify-center text-on-surface-variant active:opacity-80 Active: scale 0.95x transition-all duration-200">
<span class="material-symbols-outlined text-[24px] mb-1">home</span>
<span class="font-label-caps text-label-caps">Home</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-unit-md py-unit-xs active:opacity-80 Active: scale 0.95x transition-all duration-200">
<span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 1;">exercise</span>
<span class="font-label-caps text-label-caps">Training</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:opacity-80 Active: scale 0.95x transition-all duration-200">
<span class="material-symbols-outlined text-[24px] mb-1">chat</span>
<span class="font-label-caps text-label-caps">Messages</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant active:opacity-80 Active: scale 0.95x transition-all duration-200">
<span class="material-symbols-outlined text-[24px] mb-1">person</span>
<span class="font-label-caps text-label-caps">Profile</span>
</button>
</nav>
</body></html>
