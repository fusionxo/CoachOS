<div class="min-h-screen flex flex-col items-center justify-center px-gutter py-unit-xl bg-[#09090b]">
    <!-- Brand -->
    <div class="text-center mb-8">
        <h1 class="font-display-lg text-4xl font-black text-primary tracking-tight">CoachOS</h1>
        <p class="font-body-base text-on-surface-variant mt-2">Client Management Portal</p>
    </div>

    <!-- Login Card -->
    <div class="glass-panel w-full max-w-md rounded-2xl p-unit-lg md:p-[32px] flex flex-col gap-6 shadow-2xl">
        <div class="text-center">
            <h2 class="font-headline-md text-2xl font-bold text-primary">Welcome Back</h2>
            <p class="font-body-sm text-on-surface-variant mt-1">Sign in to manage your roster.</p>
        </div>

        <form id="login-form" class="flex flex-col gap-4">
            <div class="flex flex-col gap-1.5">
                <label class="font-label-caps text-label-caps text-on-surface-variant">EMAIL ADDRESS</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">mail</span>
                    <input type="email" id="login-email" class="w-full bg-[#09090b] border border-[#27272a] rounded-lg pl-10 pr-4 py-2.5 text-on-surface focus:border-[#6366f1] focus:ring-2 focus:ring-[#6366f1]/20 transition-all" placeholder="e.g. coach@example.com" required>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="font-label-caps text-label-caps text-on-surface-variant">PASSWORD</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">lock</span>
                    <input type="password" id="login-password" class="w-full bg-[#09090b] border border-[#27272a] rounded-lg pl-10 pr-4 py-2.5 text-on-surface focus:border-[#6366f1] focus:ring-2 focus:ring-[#6366f1]/20 transition-all" placeholder="Enter password" required>
                </div>
            </div>

            <div class="flex items-center justify-between mt-2 text-xs font-body-sm">
                <label class="flex items-center gap-2 cursor-pointer text-on-surface-variant hover:text-primary">
                    <input type="checkbox" id="login-remember" class="rounded bg-[#09090b] border-[#27272a] text-[#6366f1] focus:ring-[#6366f1]/20 w-4 h-4">
                    <span>Remember me</span>
                </label>
                <a href="#forgot-password" class="text-primary hover:underline">Forgot password?</a>
            </div>

            <button type="submit" class="w-full py-3 bg-[#d9f99d] text-[#09090b] font-semibold rounded-lg hover:bg-[#ceee93] transition-colors mt-4 flex items-center justify-center gap-2">
                <span>Sign In</span>
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </button>
        </form>

        <div class="border-t border-[#27272a] pt-4 text-center text-xs font-body-sm text-on-surface-variant">
            <span>Don't have an account? </span>
            <a href="#signup" class="text-primary hover:underline">Sign up now</a>
        </div>
    </div>
</div>
