<!-- Brand / Header -->
<div class="text-center mb-unit-xl">
<h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary mb-2">CoachOS</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Client Management</p>
</div>
<!-- Invitation Card -->
<div class="glass-panel rounded-xl p-unit-lg md:p-[32px] flex flex-col gap-unit-xl">
<!-- Coach Identity -->
<div class="flex flex-col items-center text-center gap-unit-sm">
<div class="relative mb-2">
<img alt="Coach Profile Picture" class="w-24 h-24 rounded-full border-2 border-[#27272a] object-cover" data-alt="A high-quality, professional headshot of a fitness coach. The coach looks confident and authoritative, set against a dark, moody gym background. The lighting is dramatic, highlighting their athletic physique and emphasizing the premium, high-performance aesthetic of the application. Deep blacks and subtle metallic tones dominate the scene." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkkvpynYstDI_r-E5hGdKAj5X3UGFMaqJfUXrJRJfgXSAThu4FqfNsDVDFq7PMFfk0vrkOUgpd9wJwJ4-eOEeegbiK_uMNilTdYHFrGnczf-6eTK7wTPtNBrWEnK-ctV-SL6RatsOtVFGKGuXBCHxcAurPn4yYq5hFvDIl2--cGEXjehlpSa4umBjSQqE9vEai4AjMSb2P6nFAn1mDCFMOMHpgqPgO2aNRPmiAwrkWKRE9SbN1LbLCLO8QusAP5q00Gobdwoo15iU">
<div class="absolute bottom-0 right-0 w-6 h-6 bg-[#18181b] rounded-full flex items-center justify-center border border-[#27272a]">
<span class="material-symbols-outlined text-[14px] text-primary-container" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
</div>
<h2 class="font-headline-md text-headline-md text-primary">You have been invited</h2>
<div class="font-body-base text-body-base text-on-surface-variant flex flex-col gap-1">
<p>by <span class="text-primary font-medium">Your Coach</span></p>
<p class="font-label-caps text-label-caps text-on-surface-variant/70 uppercase tracking-widest">CoachOS Workspace</p>
</div>
</div>
<hr class="border-[#27272a]">
<!-- Setup Form -->
<form class="flex flex-col gap-unit-lg">
<div class="space-y-4">
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">Full Name</label>
<div class="relative">
<input id="invitation-name" class="input-premium pl-10" placeholder="e.g. Alex Smith" type="text" required>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">person</span>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">Height</label>
<div class="relative">
<input id="invitation-height" class="input-premium pl-10" placeholder="e.g. 180" type="text">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">height</span>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-stat-mono text-stat-mono text-[14px] text-on-surface-variant/50">cm</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">Weight</label>
<div class="relative">
<input id="invitation-weight" class="input-premium pl-10" placeholder="e.g. 75" type="text">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">monitor_weight</span>
<span class="absolute right-3 top-1/2 -translate-y-1/2 font-stat-mono text-stat-mono text-[14px] text-on-surface-variant/50">kg</span>
</div>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">Primary Goal</label>
<div class="relative">
<select id="invitation-goal" class="input-premium appearance-none pl-10 pr-10 cursor-pointer">
<option disabled="" hidden="" selected="" value="">Select your goal</option>
<option value="Hypertrophy">Hypertrophy</option>
<option value="Strength">Strength &amp; Power</option>
<option value="Endurance">Endurance</option>
<option value="Body Recomposition">Body Recomposition</option>
</select>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">flag</span>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px] pointer-events-none">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">Experience Level</label>
<div class="relative">
<select id="invitation-experience" class="input-premium appearance-none pl-10 pr-10 cursor-pointer">
<option disabled="" hidden="" selected="" value="">Select experience</option>
<option value="Beginner (< 1 yr)">Beginner (&lt; 1 yr)</option>
<option value="Intermediate (1-3 yrs)">Intermediate (1-3 yrs)</option>
<option value="Advanced (3+ yrs)">Advanced (3+ yrs)</option>
</select>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">fitness_center</span>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px] pointer-events-none">expand_more</span>
</div>
</div>

<div class="flex flex-col gap-2">
<label class="font-body-sm text-body-sm text-on-surface-variant">Choose Password</label>
<div class="relative">
<input id="invitation-password" class="input-premium pl-10" placeholder="Create strong password" type="password" required>
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant/50 text-[20px]">lock</span>
</div>
</div>
</div>
<!-- Actions -->
<div class="flex flex-col gap-unit-sm mt-unit-sm">
<button class="btn-primary flex items-center justify-center gap-2" type="button">
<span>Accept Invitation</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<button class="btn-ghost" type="button">
                        Create account instead
                    </button>
</div>
</form>
</div>
<!-- Security / Trust Indicator -->
<div class="mt-unit-lg text-center flex items-center justify-center gap-2 text-on-surface-variant/50">
<span class="material-symbols-outlined text-[16px]">lock</span>
<span class="font-label-caps text-label-caps text-[10px]">Secure Encrypted Onboarding</span>
</div>
