<!-- Header Area -->
<header class="px-gutter py-unit-lg border-b border-outline-variant glass-panel sticky top-16 md:top-0 z-30 flex flex-col md:flex-row md:items-center justify-between gap-4 shrink-0">
    <div>
        <p class="font-label-caps text-label-caps text-primary-container mb-1 uppercase tracking-wider flex items-center gap-1.5 font-bold">
            <span class="material-symbols-outlined text-[16px]">edit_note</span> BLUEPRINTS & LIBRARIES
        </p>
        <h2 class="font-headline-md text-headline-md text-primary font-bold">Workout Templates</h2>
    </div>
    <div class="flex items-center gap-3">
        <button id="btn-create-template" class="btn-primary px-6 py-2.5 rounded-lg font-body-base text-xs font-bold flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-[0_0_20px_rgba(217,249,157,0.2)]">
            <span class="material-symbols-outlined text-[18px]">add_circle</span>
            <span>Create New Template</span>
        </button>
    </div>
</header>

<div class="p-gutter flex-1 flex flex-col gap-unit-md overflow-y-auto pb-20">
    <!-- Filter & Search Toolbar -->
    <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-surface-container-low p-3 rounded-xl border border-outline-variant/40">
        <!-- Category Filter Tabs -->
        <div class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0" id="template-filter-tabs">
            <button class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-primary-container text-on-primary-container btn-template-filter" data-category="all">All</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-colors btn-template-filter" data-category="hypertrophy">Hypertrophy</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-colors btn-template-filter" data-category="fat_loss">Fat Loss</button>
            <button class="px-3 py-1.5 rounded-lg text-xs font-medium text-on-surface-variant hover:text-primary hover:bg-surface-container-high transition-colors btn-template-filter" data-category="strength">Strength</button>
        </div>

        <!-- Search Bar -->
        <div class="relative w-full sm:w-64">
            <input type="text" id="template-search-input" class="w-full bg-[#09090b] border border-[#27272a] rounded-lg pl-8 pr-3 py-1.5 text-xs text-on-surface focus:border-primary-container focus:ring-1 focus:ring-primary-container placeholder:text-on-surface-variant/50" placeholder="Search templates or exercises...">
            <span class="material-symbols-outlined absolute left-2.5 top-1/2 -translate-y-1/2 text-[16px] text-on-surface-variant">search</span>
        </div>
    </div>

    <!-- Grid of Templates -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-unit-md" id="templates-grid-mount">
        <!-- Rendered dynamically by templates.js -->
    </div>

    <!-- Empty State -->
    <div id="templates-empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center card-bg border border-base rounded-xl p-8 max-w-md mx-auto fade-in">
        <span class="material-symbols-outlined text-[64px] text-primary-container mb-4">edit_note</span>
        <h3 class="font-headline-md text-primary font-bold mb-2">No Templates Found</h3>
        <p class="text-sm text-on-surface-variant mb-6">Design reusable workout templates that can be instantly assigned to any of your athletes.</p>
        <button id="btn-templates-create-first" class="btn-primary px-6 py-2.5 rounded-lg font-body-base text-xs font-bold inline-flex items-center justify-center gap-2 mx-auto transition-transform active:scale-95 shadow-[0_0_20px_rgba(217,249,157,0.2)]">
            <span class="material-symbols-outlined text-[18px]">add</span>
            <span>Create First Template</span>
        </button>
    </div>
</div>

<!-- Template Create / Edit Modal -->
<div id="template-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm template-modal-close"></div>
    <div class="card-bg border border-base rounded-xl w-full max-w-xl p-unit-lg shadow-2xl relative z-10 fade-in flex flex-col max-h-[85vh]">
        <div class="flex justify-between items-center mb-4 shrink-0">
            <h3 class="font-headline-md text-primary font-bold text-base" id="template-modal-title">Create Workout Template</h3>
            <button class="text-on-surface-variant hover:text-primary template-modal-close">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>
        <form id="template-form" class="space-y-4 overflow-y-auto pr-1 flex-1">
            <input type="hidden" id="template-id">
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                    <label class="block font-label-caps text-[10px] text-on-surface-variant mb-1 uppercase tracking-wider">Template Name</label>
                    <input type="text" id="template-name" class="w-full px-3 py-2 bg-[#0d0e12] border border-[#27272a] rounded-lg text-xs text-on-surface font-semibold" placeholder="e.g. Upper Body Hypertrophy A" required>
                </div>
                <div>
                    <label class="block font-label-caps text-[10px] text-on-surface-variant mb-1 uppercase tracking-wider">Category Tag</label>
                    <select id="template-category" class="w-full px-3 py-2 bg-[#0d0e12] border border-[#27272a] rounded-lg text-xs text-on-surface">
                        <option value="hypertrophy">Hypertrophy</option>
                        <option value="fat_loss">Fat Loss</option>
                        <option value="strength">Strength</option>
                        <option value="endurance">Endurance</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block font-label-caps text-[10px] text-on-surface-variant mb-1 uppercase tracking-wider">General Coaching Cues & Instructions</label>
                <textarea id="template-notes" class="w-full px-3 py-2 bg-[#0d0e12] border border-[#27272a] rounded-lg text-xs text-on-surface h-16 resize-none" placeholder="Focus on strict control, 2-sec eccentric phase..."></textarea>
            </div>
            
            <div class="border-t border-outline-variant/30 pt-3">
                <div class="flex justify-between items-center mb-2">
                    <h4 class="font-body-base text-primary font-semibold text-xs uppercase tracking-wider font-label-caps">Exercise Routine Builder</h4>
                    <button type="button" id="btn-template-add-ex" class="text-primary-container text-xs font-semibold hover:underline flex items-center gap-1">
                        <span class="material-symbols-outlined text-[14px]">add</span> Add Exercise
                    </button>
                </div>
                <div id="template-exercises-mount" class="space-y-3">
                    <!-- Dynamic exercise input rows -->
                </div>
            </div>
            
            <div class="pt-4 border-t border-outline-variant/30 flex justify-end gap-3 shrink-0">
                <button type="button" class="px-4 py-2 rounded-lg border border-base text-xs text-on-surface hover:bg-surface-container-high template-modal-close">Cancel</button>
                <button type="submit" class="px-5 py-2 rounded-lg bg-[#d9f99d] text-[#09090b] text-xs font-bold">Save Template</button>
            </div>
        </form>
    </div>
</div>

<!-- Template Preview Modal -->
<div id="template-preview-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm preview-modal-close"></div>
    <div class="card-bg border border-base rounded-xl w-full max-w-md p-unit-lg shadow-2xl relative z-10 fade-in flex flex-col max-h-[80vh]">
        <div class="flex justify-between items-start mb-3 border-b border-[#27272a] pb-3 shrink-0">
            <div>
                <span class="text-[9px] uppercase font-label-caps tracking-wider text-primary-container font-bold" id="preview-category">HYPERTROPHY</span>
                <h3 class="font-headline-md text-primary font-bold text-base" id="preview-title">Template Preview</h3>
            </div>
            <button class="text-on-surface-variant hover:text-primary preview-modal-close">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>
        <p class="text-xs text-on-surface-variant italic mb-3" id="preview-notes">No notes</p>
        <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="preview-exercises-list">
            <!-- Rendered preview exercises -->
        </div>
        <div class="pt-4 border-t border-[#27272a] flex justify-end gap-2 shrink-0 mt-3">
            <button type="button" class="px-4 py-2 rounded-lg border border-base text-xs text-on-surface hover:bg-surface-container-high preview-modal-close">Close</button>
            <button type="button" id="btn-preview-assign" class="px-4 py-2 rounded-lg bg-[#d9f99d] text-[#09090b] text-xs font-bold flex items-center gap-1">
                <span class="material-symbols-outlined text-[14px]">person_add</span> Assign to Client
            </button>
        </div>
    </div>
</div>

<!-- Assign Client Modal -->
<div id="assign-client-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm assign-modal-close"></div>
    <div class="card-bg border border-base rounded-xl w-full max-w-sm p-unit-lg shadow-2xl relative z-10 fade-in">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-headline-md text-primary font-bold text-base">Assign Template to Client</h3>
            <button class="text-on-surface-variant hover:text-primary assign-modal-close">
                <span class="material-symbols-outlined text-lg">close</span>
            </button>
        </div>
        <form id="assign-client-form" class="space-y-4">
            <input type="hidden" id="assign-template-id">
            <div>
                <label class="block font-label-caps text-[10px] text-on-surface-variant mb-1 uppercase tracking-wider">Select Client</label>
                <select id="assign-client-select" class="w-full px-3 py-2 bg-[#0d0e12] border border-[#27272a] rounded-lg text-xs text-on-surface" required>
                    <!-- Populated dynamically -->
                </select>
            </div>
            <div class="pt-4 border-t border-outline-variant/30 flex justify-end gap-3">
                <button type="button" class="px-4 py-2 rounded-lg border border-base text-xs text-on-surface hover:bg-surface-container-high assign-modal-close">Cancel</button>
                <button type="submit" class="px-4 py-2 rounded-lg bg-[#d9f99d] text-[#09090b] text-xs font-bold">Assign Now</button>
            </div>
        </form>
    </div>
</div>
