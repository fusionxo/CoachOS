<header class="px-gutter py-unit-lg border-b border-outline-variant glass-panel sticky top-16 md:top-0 z-30 flex flex-col md:flex-row md:items-center justify-between gap-4 shrink-0">
    <div>
        <p class="font-label-caps text-label-caps text-primary-container mb-1 uppercase tracking-wider">Directory</p>
        <h2 class="font-headline-md text-headline-md text-primary font-bold">Client Management</h2>
    </div>
    <a href="#add-client" class="btn-primary px-6 py-3 rounded-lg font-body-base text-body-base font-semibold flex items-center justify-center gap-2 transition-transform active:scale-95 shadow-[0_0_20px_rgba(217,249,157,0.2)]">
        <span class="material-symbols-outlined text-[20px]">person_add</span>
        <span>Add New Client</span>
    </a>
</header>

<div class="p-gutter flex-1 flex flex-col gap-unit-lg overflow-y-auto">
    <!-- Controls Section -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-unit-md shrink-0">
        <!-- Search -->
        <div class="relative w-full md:max-w-md">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
            <input type="text" id="client-search" class="w-full bg-[#0d0e12] border border-[#27272a] rounded-lg py-2.5 pl-10 pr-4 text-body-sm text-on-surface" placeholder="Search client name, email, or goal...">
        </div>
        <!-- Filters -->
        <div class="flex overflow-x-auto gap-2 w-full md:w-auto shrink-0 pb-2 md:pb-0 hide-scrollbar">
            <button class="px-4 py-2 rounded-lg bg-surface-container-high border border-outline-variant text-primary text-xs font-semibold btn-client-filter active" data-filter="all">All</button>
            <button class="px-4 py-2 rounded-lg bg-transparent border border-transparent text-on-surface-variant text-xs font-semibold btn-client-filter" data-filter="attention">Needs Attention</button>
            <button class="px-4 py-2 rounded-lg bg-transparent border border-transparent text-on-surface-variant text-xs font-semibold btn-client-filter" data-filter="active">Active</button>
            <button class="px-4 py-2 rounded-lg bg-transparent border border-transparent text-on-surface-variant text-xs font-semibold btn-client-filter" data-filter="inactive">Inactive</button>
        </div>
    </div>

    <!-- Clients Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-unit-md" id="clients-grid-mount">
        <!-- Rendered dynamically by clients.js -->
    </div>

    <!-- Empty State -->
    <div id="clients-empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center card-bg border border-base rounded-xl p-8 max-w-md mx-auto">
        <span class="material-symbols-outlined text-[64px] text-on-surface-variant mb-4">search_off</span>
        <h3 class="font-headline-md text-primary mb-2">No Clients Found</h3>
        <p class="text-sm text-on-surface-variant">Try refining your search query or change the status filter tab.</p>
    </div>
</div>

<!-- Edit Client Modal -->
<div id="edit-client-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60 backdrop-blur-sm modal-close-trigger"></div>
    <div class="card-bg border border-base rounded-xl w-full max-w-md p-unit-lg shadow-2xl relative z-10 fade-in">
        <div class="flex justify-between items-center mb-6">
            <h3 class="font-headline-md text-primary font-bold">Edit Client Details</h3>
            <button class="text-on-surface-variant hover:text-primary modal-close-trigger">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>
        <form id="edit-client-form" class="space-y-4">
            <input type="hidden" id="edit-client-id">
            <div>
                <label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Name</label>
                <input type="text" id="edit-client-name" class="w-full px-4 py-2.5 bg-[#0d0e12] border border-[#27272a] rounded-lg text-on-surface" required>
            </div>
            <div>
                <label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Email</label>
                <input type="email" id="edit-client-email" class="w-full px-4 py-2.5 bg-[#0d0e12] border border-[#27272a] rounded-lg text-on-surface" required>
            </div>
            <div>
                <label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Goal</label>
                <select id="edit-client-goal" class="w-full px-4 py-2.5 bg-[#0d0e12] border border-[#27272a] rounded-lg text-on-surface">
                    <option value="Fat Loss">Fat Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="Strength">Strength</option>
                    <option value="Performance">Performance</option>
                </select>
            </div>
            <div>
                <label class="block font-label-caps text-label-caps text-on-surface-variant mb-1 uppercase">Status</label>
                <select id="edit-client-status" class="w-full px-4 py-2.5 bg-[#0d0e12] border border-[#27272a] rounded-lg text-on-surface">
                    <option value="Healthy">Healthy</option>
                    <option value="Warning">Warning</option>
                    <option value="Critical">Critical</option>
                    <option value="Health Alert">Health Alert</option>
                </select>
            </div>
            <div class="pt-4 border-t border-outline-variant/30 flex justify-end gap-3">
                <button type="button" class="px-5 py-2.5 rounded-lg border border-base text-on-surface hover:bg-surface-container-high modal-close-trigger">Cancel</button>
                <button type="submit" class="px-5 py-2.5 rounded-lg bg-[#d9f99d] text-[#09090b] font-semibold">Save Changes</button>
            </div>
        </form>
    </div>
</div>
