<div class="min-h-screen flex flex-col items-center justify-center px-gutter py-unit-xl bg-[#09090b]">
    <!-- Brand -->
    <div class="text-center mb-8">
        <h1 class="font-display-lg text-4xl font-black text-primary tracking-tight">CoachOS</h1>
        <p class="font-body-base text-on-surface-variant mt-2">Client Management Portal</p>
    </div>

    <!-- Card -->
    <div class="glass-panel w-full max-w-md rounded-2xl p-unit-lg md:p-[32px] flex flex-col gap-6 shadow-2xl">
        <!-- Request Password Reset Form -->
        <div id="request-reset-container" class="space-y-6">
            <div class="text-center">
                <h2 class="font-headline-md text-2xl font-bold text-primary">Reset Password</h2>
                <p class="font-body-sm text-on-surface-variant mt-1">We will email you a link to reset your password.</p>
            </div>

            <form id="forgot-form" class="flex flex-col gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="font-label-caps text-label-caps text-on-surface-variant">EMAIL ADDRESS</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">mail</span>
                        <input type="email" id="forgot-email" class="w-full bg-[#09090b] border border-[#27272a] rounded-lg pl-10 pr-4 py-2.5 text-on-surface focus:border-[#6366f1] focus:ring-2 focus:ring-[#6366f1]/20 transition-all" placeholder="e.g. coach@example.com" required>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-[#d9f99d] text-[#09090b] font-semibold rounded-lg hover:bg-[#ceee93] transition-colors mt-4 flex items-center justify-center gap-2">
                    <span>Send Reset Link</span>
                    <span class="material-symbols-outlined text-[18px]">send</span>
                </button>
            </form>
        </div>

        <!-- Update Password Form (Shown when token is active in URL or user clicked recovery link) -->
        <div id="update-password-container" class="hidden space-y-6">
            <div class="text-center">
                <h2 class="font-headline-md text-2xl font-bold text-primary">Set New Password</h2>
                <p class="font-body-sm text-on-surface-variant mt-1">Enter your new workspace password below.</p>
            </div>

            <form id="new-password-form" class="flex flex-col gap-4">
                <div class="flex flex-col gap-1.5">
                    <label class="font-label-caps text-label-caps text-on-surface-variant">NEW PASSWORD</label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-3 text-on-surface-variant text-[20px]">lock</span>
                        <input type="password" id="new-password-input" class="w-full bg-[#09090b] border border-[#27272a] rounded-lg pl-10 pr-4 py-2.5 text-on-surface focus:border-[#6366f1] focus:ring-2 focus:ring-[#6366f1]/20 transition-all" placeholder="Enter new password" required>
                    </div>
                </div>

                <button type="submit" class="w-full py-3 bg-[#d9f99d] text-[#09090b] font-semibold rounded-lg hover:bg-[#ceee93] transition-colors mt-4 flex items-center justify-center gap-2">
                    <span>Update Password</span>
                    <span class="material-symbols-outlined text-[18px]">check</span>
                </button>
            </form>
        </div>

        <div class="border-t border-[#27272a] pt-4 text-center text-xs font-body-sm text-on-surface-variant">
            <span>Back to </span>
            <a href="#login" class="text-primary hover:underline">Sign In</a>
        </div>
    </div>
</div>
