<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9f99d"/>
      <stop offset="100%" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Outer Glow Hexagon / Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#27272a" stroke-width="8" stroke-dasharray="16 12"/>

  <!-- Neon Accent Arc (CoachOS "C") -->
  <path d="M 330 155 A 135 135 0 1 0 330 357" fill="none" stroke="url(#accentGrad)" stroke-width="32" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Stylized Dumbbell / Core Bolt in Center -->
  <g transform="translate(216, 216)">
    <!-- Central Power Lightning / Bar -->
    <path d="M 45 5 L 15 45 L 40 45 L 35 75 L 65 35 L 40 35 Z" fill="url(#accentGrad)" />
  </g>
</svg>
